name: HortiExam Online Pages
on:
  push:
    branches: [main]
    paths: ['offline/**', 'online/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['offline/**', 'online/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: online-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline editor and encryption
        run: node --test offline/tests/*.test.cjs
      - name: Install online service dependencies
        run: npm ci --prefix online --ignore-scripts
      - name: Test access service and build Worker
        run: |
          npm test --prefix online
          npm run build --prefix online
      - name: Build public client without examination data
        run: python online/tools/build_pages.py --out pages-dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy online examination workspace
        id: deployment
        uses: actions/deploy-pages@v4

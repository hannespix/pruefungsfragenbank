name: Offline prototype checks
on:
  push:
    paths: ['offline/**', '.github/workflows/offline-tests.yml']
  pull_request:
    paths: ['offline/**', '.github/workflows/offline-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test offline/tests/*.test.cjs
      - run: python offline/tools/build.py

name: KI-Schreibhilfe einrichten

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'KI-Schreibhilfe aktivieren, Schlüssel ersetzen oder deaktivieren'
        type: choice
        required: true
        default: aktivieren-oder-aktualisieren
        options:
          - aktivieren-oder-aktualisieren
          - deaktivieren

permissions:
  contents: read

concurrency:
  group: hortiexam-ai-secret
  cancel-in-progress: false

jobs:
  configure:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Einrichtung ohne echte Zugangsdaten prüfen
        run: node --test online/tests/ai-secret.test.mjs
      - name: Worker-Secret einrichten oder entfernen
        run: node online/tools/configure_ai_secret.mjs
        env:
          AI_SECRET_ACTION: ${{ inputs.action }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ inputs.action == 'aktivieren-oder-aktualisieren' && secrets.ANTHROPIC_API_KEY || '' }}
